<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乘法算算．找找．塗塗 學習單產生器</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style id="page-style">
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    
    body {
      font-family: 'Noto Sans TC', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 動態 A4 紙張列印設定 */
    @page {
      size: A4 portrait;
      margin: 4mm 6mm;
    }

    /* 列印專用樣式優化 */
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background-color: white !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .print-container {
        box-shadow: none !important;
        border: none !important;
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      /* 直式 2 題模式 (緊湊單頁 A4) */
      .print-container.portrait-mode {
        max-width: 195mm !important;
      }
      .print-container.portrait-mode .single-sheet-block {
        padding: 2mm 0 !important;
        margin-bottom: 1mm !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      .print-container.portrait-mode .sheet-header {
        margin-bottom: 2mm !important;
        padding-bottom: 1mm !important;
      }
      .print-container.portrait-mode .equation-box {
        padding: 1px 2px !important;
        font-size: 11px !important;
      }
      .print-container.portrait-mode .equation-box input {
        width: 22px !important;
        height: 16px !important;
        font-size: 11px !important;
      }
      .print-container.portrait-mode .grid-cell {
        width: 8.8mm !important;
        height: 8.8mm !important;
        font-size: 11px !important;
        font-weight: 800 !important;
        line-height: 1 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .print-container.portrait-mode .target-badge {
        width: 28px !important;
        height: 28px !important;
        font-size: 16px !important;
      }

      /* 橫式 1 題雙欄模式 */
      .print-container.landscape-mode {
        max-width: 280mm !important;
      }
      .print-container.landscape-mode #main-content-wrapper {
        display: flex !important;
        flex-direction: row !important;
        justify-content: space-between !important;
        align-items: center !important;
        gap: 1.5rem !important;
      }
      .print-container.landscape-mode #left-section-0 {
        width: 38% !important;
      }
      .print-container.landscape-mode #right-section-0 {
        width: 60% !important;
      }
      .print-container.landscape-mode .equation-container {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 0.35rem !important;
      }
      .print-container.landscape-mode .grid-cell {
        width: 12mm !important;
        height: 12mm !important;
        font-size: 13px !important;
        font-weight: 800 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .number-grid {
        display: grid !important;
        grid-template-columns: repeat(20, minmax(0, 1fr)) !important;
        gap: 1.5px !important;
        margin: 0 auto !important;
        width: 90% !important;
      }

      /* 列印線條與文字清晰度提升 */
      * {
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
    }

    /* 20 欄數字網格矩陣 (預設 90% 寬度) */
    .number-grid {
      display: grid;
      grid-template-columns: repeat(20, minmax(0, 1fr));
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      width: 90%;
      margin: 0 auto;
    }

    .grid-cell {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      aspect-ratio: 1 / 1;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-2 sm:p-6">

  <!-- 閒雲數學小棧 頂部 Logo 標籤區 -->
  <div id="top-brand" class="no-print w-full max-w-4xl mx-auto flex items-center justify-start mb-4 px-2 fade-in">
    <img src="https://lh3.googleusercontent.com/d/1qUdM3yxfDP9U8S1PAlYScLXLG9riPxMt" alt="閒雲數學小棧Logo" class="h-8 w-auto mr-3 object-contain drop-shadow-md rounded-full bg-white/30 p-1" onerror="this.src='https://placehold.co/40x40/ffffff/333333?text=Logo'">
    <span class="text-xl md:text-2xl font-bold text-slate-800 drop-shadow-lg tracking-wider" style="text-shadow: 1px 1px 3px rgba(0,0,0,0.2);">閒雲數學小棧</span>
  </div>

  <!-- 上方控制列 -->
  <header id="control-header" class="no-print max-w-4xl mx-auto bg-white rounded-2xl shadow-md p-4 mb-6 border border-slate-200 transition-all duration-300">
    <div class="flex flex-wrap justify-between items-center gap-4 mb-3 pb-3 border-b border-slate-100">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🎨</span>
        <div>
          <h1 class="text-xl font-bold text-slate-800">乘法｜算算．找找．塗塗 產生器</h1>
          <p class="text-xs text-slate-500">專為國小 2-9 乘法設計的互動學習單工具（支援平板與大螢幕觸控）</p>
        </div>
      </div>

      <!-- 操作按鈕區 -->
      <div class="flex flex-wrap gap-2">
        <button onclick="regenerateNumbers()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-bold flex items-center gap-1 transition active:scale-95 touch-manipulation">
          🎲 重新打散數字
        </button>
        <button onclick="toggleAnswerKey()" id="btn-answer" class="px-3 py-2 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-xl text-sm font-bold flex items-center gap-1 transition active:scale-95 touch-manipulation">

        </button>
        <button onclick="checkAnswers()" class="px-3 py-2 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 rounded-xl text-sm font-bold flex items-center gap-1 transition active:scale-95 touch-manipulation">
          ✅ 驗算答案
        </button>
        <button onclick="clearColoring()" class="px-3 py-2 bg-rose-100 hover:bg-rose-200 text-rose-800 rounded-xl text-sm font-bold flex items-center gap-1 transition active:scale-95 touch-manipulation">
          🧹 清空塗色
        </button>
        <button onclick="printWorksheet()" class="px-4 py-2 bg-orange-500 hover:bg-orange-600 text-white rounded-xl text-sm font-bold flex items-center gap-1 shadow-sm transition active:scale-95 touch-manipulation">
          🖨️ 列印/儲存為PDF
        </button>

    </div>

    <!-- 寬敞對齊控制選項區 -->
    <div class="flex flex-wrap items-center justify-between gap-x-12 sm:gap-x-16 gap-y-3.5 mb-2">
      <!-- 選擇乘數 -->
      <div class="flex items-center gap-2">
        <span class="text-xs sm:text-sm font-bold text-slate-600 shrink-0">選擇乘數：</span>
        <div class="flex flex-wrap gap-1" id="num-selector">
          <!-- JS 動態生成 2~9 按鈕 -->
        </div>
      </div>

      <!-- 圖案種類選擇 (7 種模式) -->
      <div class="flex items-center gap-2">
        <span class="text-xs sm:text-sm font-bold text-slate-600 shrink-0">圖案種類：</span>
        <div class="inline-flex flex-wrap rounded-xl p-0.5 bg-slate-100 border border-slate-200 gap-0.5" id="mode-selector">
          <button onclick="selectPatternMode('lms')" id="mode-btn-lms" class="px-2 py-1 rounded-lg font-bold text-xs transition bg-orange-500 text-white shadow-sm touch-manipulation">大中小</button>
          <button onclick="selectPatternMode('lm')" id="mode-btn-lm" class="px-2 py-1 rounded-lg font-bold text-xs transition text-slate-600 hover:text-slate-900 touch-manipulation">大中</button>
          <button onclick="selectPatternMode('ls')" id="mode-btn-ls" class="px-2 py-1 rounded-lg font-bold text-xs transition text-slate-600 hover:text-slate-900 touch-manipulation">大小</button>
          <button onclick="selectPatternMode('ms')" id="mode-btn-ms" class="px-2 py-1 rounded-lg font-bold text-xs transition text-slate-600 hover:text-slate-900 touch-manipulation">中小</button>
          <button onclick="selectPatternMode('l')" id="mode-btn-l" class="px-2 py-1 rounded-lg font-bold text-xs transition text-slate-600 hover:text-slate-900 touch-manipulation">大</button>
          <button onclick="selectPatternMode('m')" id="mode-btn-m" class="px-2 py-1 rounded-lg font-bold text-xs transition text-slate-600 hover:text-slate-900 touch-manipulation">中</button>
          <button onclick="selectPatternMode('s')" id="mode-btn-s" class="px-2 py-1 rounded-lg font-bold text-xs transition text-slate-600 hover:text-slate-900 touch-manipulation">小</button>
        </div>
      </div>
    </div>
    
    <div class="flex flex-wrap sm:flex-nowrap items-center justify-between gap-x-4 sm:gap-x-6 gap-y-3.5">
      <!-- 紙張排版選擇 -->
      <div class="flex items-center gap-2 whitespace-nowrap">
        <span class="text-xs sm:text-sm font-bold text-slate-600 shrink-0">紙張排版：</span>
        <div class="inline-flex rounded-xl p-0.5 bg-slate-100 border border-slate-200" id="orientation-selector">
          <button onclick="selectOrientation('portrait')" id="orient-btn-portrait" class="px-2.5 py-1 rounded-lg font-bold text-xs transition bg-orange-500 text-white shadow-sm touch-manipulation">📄 直式 (2題)</button>
          <button onclick="selectOrientation('landscape')" id="orient-btn-landscape" class="px-2.5 py-1 rounded-lg font-bold text-xs transition text-slate-600 hover:text-slate-900 touch-manipulation">🖼️ 橫式 (1題)</button>
        </div>
      </div>

      <!-- 觸控塗色工具選單 -->
      <div class="flex items-center gap-2 whitespace-nowrap">
        <span class="text-xs sm:text-sm font-bold text-slate-600 shrink-0">觸控工具：</span>
        <div class="inline-flex rounded-xl p-0.5 bg-slate-100 border border-slate-200">
          <button onclick="setTouchTool('paint')" id="tool-btn-paint" class="px-2.5 py-1 rounded-lg font-bold text-xs transition bg-orange-500 text-white shadow-sm touch-manipulation">🖌️ 塗色模式</button>
          <button onclick="setTouchTool('erase')" id="tool-btn-erase" class="px-2.5 py-1 rounded-lg font-bold text-xs transition text-slate-600 hover:text-slate-900 touch-manipulation">🧼 橡皮擦</button>
        </div>
      </div>

      <!-- 主題色彩選擇器 -->
      <div class="flex items-center gap-2 whitespace-nowrap">
        <span class="text-xs sm:text-sm font-bold text-slate-600 shrink-0">主題色彩：</span>
        <div class="flex gap-1.5" id="color-selector">
          <button onclick="changeTheme('#f97316')" class="w-6 h-6 rounded-full bg-orange-500 ring-2 ring-offset-1 ring-orange-500 touch-manipulation"></button>
          <button onclick="changeTheme('#3b82f6')" class="w-6 h-6 rounded-full bg-blue-500 touch-manipulation"></button>
          <button onclick="changeTheme('#10b981')" class="w-6 h-6 rounded-full bg-emerald-500 touch-manipulation"></button>
          <button onclick="changeTheme('#8b5cf6')" class="w-6 h-6 rounded-full bg-purple-500 touch-manipulation"></button>
          <button onclick="changeTheme('#ec4899')" class="w-6 h-6 rounded-full bg-pink-500 touch-manipulation"></button>
        </div>
      </div>
    </div>
  </header>

  <!-- 學習單主體容器 (支援直式 2 題與橫式 1 題) -->
  <main id="worksheet-main" class="print-container portrait-mode max-w-4xl mx-auto bg-white rounded-2xl shadow-lg border border-slate-200 p-4 sm:p-8 mb-10 transition-all duration-300">
    <div id="sheets-container" class="flex flex-col gap-6">
      <!-- 由 JS 動態生成 1 份或 2 份學習單內容 -->
    </div>
  </main>

  <!-- 自訂成績核對視窗 -->
  <div id="result-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden no-print">
    <div id="modal-box" class="bg-white rounded-2xl p-6 max-w-md w-full mx-4 shadow-2xl border border-slate-100 text-center transform transition-all flex flex-col max-h-[90vh]">
      <div class="text-4xl mb-2" id="modal-icon">🎉</div>
      <h3 class="text-xl font-bold text-slate-800 mb-3" id="modal-title">驗算批改結果</h3>
      
      <div id="modal-details-container" class="overflow-y-auto px-1 mb-4">
        <!-- 動態生成的成績區塊將插入於此 -->
      </div>

      <p id="modal-msg" class="text-sm font-medium text-slate-600 mb-5 shrink-0">太棒了！全對！隱藏數字成功顯現了！</p>
      <button onclick="closeModal()" class="w-full py-2.5 bg-orange-500 hover:bg-orange-600 text-white rounded-xl font-bold transition shadow-md touch-manipulation shrink-0">
        確定
      </button>
    </div>
  </div>

  <!-- 列印備用提示視窗 -->
  <div id="print-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden no-print">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full mx-4 shadow-2xl border border-slate-100 text-center">
      <div class="text-4xl mb-2">🖨️</div>
      <h3 class="text-xl font-bold text-slate-800 mb-2">開啟列印選單</h3>
      <p class="text-sm text-slate-600 mb-4">若系統未自動彈出列印視窗，請按下鍵盤快捷鍵：<br><span class="inline-block mt-2 font-mono font-bold bg-slate-100 px-3 py-1 rounded-lg text-orange-600">Ctrl + P</span> (Mac: <span class="font-mono font-bold bg-slate-100 px-3 py-1 rounded-lg text-orange-600">Cmd + P</span>)</p>
      <button onclick="closePrintModal()" class="w-full py-2 bg-orange-500 hover:bg-orange-600 text-white rounded-xl font-bold transition">
        好，我知道了
      </button>
    </div>
  </div>

  <script>
    // 全域狀態變數
    let currentNum = 2;
    let currentThemeColor = '#f97316';
    let currentPatternMode = 'lms';
    let currentOrientation = 'portrait'; // 'portrait': 直式(2題), 'landscape': 橫式(1題)
    let touchTool = 'paint';
    let showAnswers = false;
    let isMouseDown = false;
    let gridMatrices = []; // 儲存各題目的網格陣列

    // 七段顯示器 Segment 對照表
    const segs = {
      0: ['a', 'b', 'c', 'd', 'e', 'f'],
      1: ['b', 'c'],
      2: ['a', 'b', 'g', 'e', 'd'],
      3: ['a', 'b', 'g', 'c', 'd'],
      4: ['f', 'g', 'b', 'c'],
      5: ['a', 'f', 'g', 'c', 'd'],
      6: ['a', 'f', 'g', 'e', 'c', 'd'],
      7: ['a', 'b', 'c'],
      8: ['a', 'b', 'c', 'd', 'e', 'f', 'g'],
      9: ['a', 'b', 'c', 'd', 'f', 'g']
    };

    // 大數位 (12x6)
    function drawLargeDigit(matrix, num, startRow, startCol) {
      const activeSegs = segs[num] || [];
      const setCells = (rMin, rMax, cMin, cMax) => {
        for (let r = rMin; r <= rMax; r++) {
          for (let c = cMin; c <= cMax; c++) {
            if (r >= 0 && r < 14 && c >= 0 && c < 20) matrix[r][c] = true;
          }
        }
      };
      if (activeSegs.includes('a')) setCells(startRow, startRow + 1, startCol, startCol + 5);
      if (activeSegs.includes('f')) setCells(startRow, startRow + 5, startCol, startCol + 1);
      if (activeSegs.includes('b')) setCells(startRow, startRow + 5, startCol + 4, startCol + 5);
      if (activeSegs.includes('g')) setCells(startRow + 5, startRow + 6, startCol, startCol + 5);
      if (activeSegs.includes('e')) setCells(startRow + 5, startRow + 11, startCol, startCol + 1);
      if (activeSegs.includes('c')) setCells(startRow + 5, startRow + 11, startCol + 4, startCol + 5);
      if (activeSegs.includes('d')) setCells(startRow + 10, startRow + 11, startCol, startCol + 5);
    }

    // 中數位 (10x5)
    function drawMediumDigit(matrix, num, startRow, startCol) {
      const activeSegs = segs[num] || [];
      const setCells = (rMin, rMax, cMin, cMax) => {
        for (let r = rMin; r <= rMax; r++) {
          for (let c = cMin; c <= cMax; c++) {
            if (r >= 0 && r < 14 && c >= 0 && c < 20) matrix[r][c] = true;
          }
        }
      };
      if (activeSegs.includes('a')) setCells(startRow, startRow + 1, startCol, startCol + 4);
      if (activeSegs.includes('f')) setCells(startRow, startRow + 4, startCol, startCol + 1);
      if (activeSegs.includes('b')) setCells(startRow, startRow + 4, startCol + 3, startCol + 4);
      if (activeSegs.includes('g')) setCells(startRow + 4, startRow + 5, startCol, startCol + 4);
      if (activeSegs.includes('e')) setCells(startRow + 4, startRow + 9, startCol, startCol + 1);
      if (activeSegs.includes('c')) setCells(startRow + 4, startRow + 9, startCol + 3, startCol + 4);
      if (activeSegs.includes('d')) setCells(startRow + 8, startRow + 9, startCol, startCol + 4);
    }

    // 小數位 (7x4)
    function drawSmallDigit7x4(matrix, num, startRow, startCol) {
      const activeSegs = segs[num] || [];
      const setCells = (rMin, rMax, cMin, cMax) => {
        for (let r = rMin; r <= rMax; r++) {
          for (let c = cMin; c <= cMax; c++) {
            if (r >= 0 && r < 14 && c >= 0 && c < 20) matrix[r][c] = true;
          }
        }
      };
      if (activeSegs.includes('a')) setCells(startRow, startRow, startCol, startCol + 3);
      if (activeSegs.includes('f')) setCells(startRow, startRow + 3, startCol, startCol);
      if (activeSegs.includes('b')) setCells(startRow, startRow + 3, startCol + 3, startCol + 3);
      if (activeSegs.includes('g')) setCells(startRow + 3, startRow + 3, startCol, startCol + 3);
      if (activeSegs.includes('e')) setCells(startRow + 3, startRow + 6, startCol, startCol);
      if (activeSegs.includes('c')) setCells(startRow + 3, startRow + 6, startCol + 3, startCol + 3);
      if (activeSegs.includes('d')) setCells(startRow + 6, startRow + 6, startCol, startCol + 3);
    }

    // 小數位 (5x3)
    function drawSmallDigit5x3(matrix, num, startRow, startCol) {
      const activeSegs = segs[num] || [];
      const setCells = (rMin, rMax, cMin, cMax) => {
        for (let r = rMin; r <= rMax; r++) {
          for (let c = cMin; c <= cMax; c++) {
            if (r >= 0 && r < 14 && c >= 0 && c < 20) matrix[r][c] = true;
          }
        }
      };
      if (activeSegs.includes('a')) setCells(startRow, startRow, startCol, startCol + 2);
      if (activeSegs.includes('f')) setCells(startRow, startRow + 2, startCol, startCol);
      if (activeSegs.includes('b')) setCells(startRow, startRow + 2, startCol + 2, startCol + 2);
      if (activeSegs.includes('g')) setCells(startRow + 2, startRow + 2, startCol, startCol + 2);
      if (activeSegs.includes('e')) setCells(startRow + 2, startRow + 4, startCol, startCol);
      if (activeSegs.includes('c')) setCells(startRow + 2, startRow + 4, startCol + 2, startCol + 2);
      if (activeSegs.includes('d')) setCells(startRow + 4, startRow + 4, startCol, startCol + 2);
    }

    // 產生圖案 14x20 布林矩陣
    function generatePatternMatrix(num) {
      const matrix = Array.from({ length: 14 }, () => Array(20).fill(false));

      const getItemDimensions = (type) => {
        if (type === 'lg') return { h: 12, w: 6 };
        if (type === 'med') return { h: 10, w: 5 };
        if (type === 'sm7') return { h: 7, w: 4 };
        return { h: 5, w: 3 };
      };

      function checkOverlap(r1, c1, h1, w1, r2, c2, h2, w2, margin = 1) {
        return !(r1 + h1 + margin <= r2 || 
                 r2 + h2 + margin <= r1 || 
                 c1 + w1 + margin <= c2 || 
                 c2 + w2 + margin <= c1);
      }

      const layoutTemplates = {
        lms: [
          [{type: 'lg', base: [0, 0]}, {type: 'med', base: [2, 8]}, {type: 'sm7', base: [0, 15]}, {type: 'sm5', base: [8, 15]}],
          [{type: 'lg', base: [1, 13]}, {type: 'med', base: [2, 1]}, {type: 'sm7', base: [0, 7]}, {type: 'sm5', base: [8, 7]}],
          [{type: 'lg', base: [0, 7]}, {type: 'med', base: [2, 0]}, {type: 'sm7', base: [0, 15]}, {type: 'sm5', base: [8, 15]}]
        ],
        lm: [
          [{type: 'lg', base: [1, 0]}, {type: 'med', base: [0, 8]}, {type: 'med', base: [3, 14]}],
          [{type: 'lg', base: [0, 13]}, {type: 'med', base: [3, 0]}, {type: 'med', base: [1, 7]}],
          [{type: 'lg', base: [1, 7]}, {type: 'med', base: [0, 0]}, {type: 'med', base: [2, 14]}]
        ],
        ls: [
          [{type: 'lg', base: [1, 0]}, {type: 'sm7', base: [0, 8]}, {type: 'sm5', base: [8, 8]}, {type: 'sm7', base: [6, 14]}, {type: 'sm5', base: [0, 15]}],
          [{type: 'lg', base: [0, 13]}, {type: 'sm7', base: [2, 0]}, {type: 'sm5', base: [8, 1]}, {type: 'sm7', base: [0, 7]}, {type: 'sm5', base: [7, 7]}],
          [{type: 'lg', base: [2, 7]}, {type: 'sm7', base: [0, 1]}, {type: 'sm5', base: [8, 0]}, {type: 'sm7', base: [6, 15]}, {type: 'sm5', base: [0, 15]}]
        ],
        ms: [
          [{type: 'med', base: [0, 0]}, {type: 'med', base: [3, 7]}, {type: 'sm7', base: [0, 14]}, {type: 'sm5', base: [8, 15]}],
          [{type: 'med', base: [3, 14]}, {type: 'med', base: [0, 7]}, {type: 'sm7', base: [6, 0]}, {type: 'sm5', base: [0, 1]}]
        ],
        l: [
          [{type: 'lg', base: [1, 7]}],
          [{type: 'lg', base: [0, 1]}, {type: 'lg', base: [2, 11]}],
          [{type: 'lg', base: [2, 0]}, {type: 'lg', base: [0, 7]}, {type: 'lg', base: [2, 13]}]
        ],
        m: [
          [{type: 'med', base: [1, 1]}, {type: 'med', base: [3, 8]}, {type: 'med', base: [0, 14]}],
          [{type: 'med', base: [0, 2]}, {type: 'med', base: [3, 11]}]
        ],
        s: [
          [{type: 'sm7', base: [0, 0]}, {type: 'sm5', base: [8, 1]}, {type: 'sm7', base: [2, 7]}, {type: 'sm5', base: [8, 8]}, {type: 'sm7', base: [0, 14]}, {type: 'sm5', base: [8, 15]}],
          [{type: 'sm5', base: [1, 1]}, {type: 'sm7', base: [6, 2]}, {type: 'sm5', base: [0, 8]}, {type: 'sm7', base: [7, 8]}, {type: 'sm5', base: [1, 15]}, {type: 'sm7', base: [6, 14]}]
        ]
      };

      const modeTemplates = layoutTemplates[currentPatternMode] || layoutTemplates['lms'];
      const template = modeTemplates[Math.floor(Math.random() * modeTemplates.length)];

      const placedBoxes = [];

      for (const item of template) {
        let type = item.type;
        if (type === 'sm') type = Math.random() > 0.5 ? 'sm7' : 'sm5';

        const dim = getItemDimensions(type);
        let placed = false;
        let bestR = item.base[0];
        let bestC = item.base[1];

        for (let attempt = 0; attempt < 40; attempt++) {
          const jitterR = Math.floor(Math.random() * 5) - 2;
          const jitterC = Math.floor(Math.random() * 5) - 2;

          const testR = Math.max(0, Math.min(14 - dim.h, item.base[0] + jitterR));
          const testC = Math.max(0, Math.min(20 - dim.w, item.base[1] + jitterC));

          const overlaps = placedBoxes.some(box => checkOverlap(testR, testC, dim.h, dim.w, box.r, box.c, box.h, box.w, 1));

          if (!overlaps) {
            bestR = testR;
            bestC = testC;
            placed = true;
            break;
          }
        }

        if (!placed) {
          for (let r = 0; r <= 14 - dim.h; r++) {
            for (let c = 0; c <= 20 - dim.w; c++) {
              const overlaps = placedBoxes.some(box => checkOverlap(r, c, dim.h, dim.w, box.r, box.c, box.h, box.w, 1));
              if (!overlaps) {
                bestR = r;
                bestC = c;
                placed = true;
                break;
              }
            }
            if (placed) break;
          }
        }

        if (placed) {
          placedBoxes.push({ r: bestR, c: bestC, h: dim.h, w: dim.w });

          if (type === 'lg') drawLargeDigit(matrix, num, bestR, bestC);
          else if (type === 'med') drawMediumDigit(matrix, num, bestR, bestC);
          else if (type === 'sm7') drawSmallDigit7x4(matrix, num, bestR, bestC);
          else if (type === 'sm5') drawSmallDigit5x3(matrix, num, bestR, bestC);
        }
      }

      return matrix;
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    // 生成單一題目的網格資料
    function generateSingleGridData() {
      const patternMatrix = generatePatternMatrix(currentNum);
      const validAnswers = [];
      for (let i = 1; i <= 10; i++) validAnswers.push(currentNum * i);

      let targetCount = 0;
      for (let r = 0; r < 14; r++) {
        for (let c = 0; c < 20; c++) {
          if (patternMatrix[r][c]) targetCount++;
        }
      }

      let targetPool = [];
      while (targetPool.length < targetCount) {
        targetPool = targetPool.concat(validAnswers);
      }
      targetPool = targetPool.slice(0, targetCount);
      shuffleArray(targetPool);

      const distractors = [];
      const maxRange = Math.max(100, currentNum * 12);
      for (let n = 1; n <= maxRange; n++) {
        if (n % currentNum !== 0) distractors.push(n);
      }

      const nonTargetCount = 280 - targetCount;
      let distractorPool = [];
      while (distractorPool.length < nonTargetCount) {
        distractorPool = distractorPool.concat(distractors);
      }
      distractorPool = distractorPool.slice(0, nonTargetCount);
      shuffleArray(distractorPool);

      const matrix = [];
      let tIndex = 0;
      let dIndex = 0;

      for (let r = 0; r < 14; r++) {
        const row = [];
        for (let c = 0; c < 20; c++) {
          const isTarget = patternMatrix[r][c];
          const val = isTarget ? targetPool[tIndex++] : distractorPool[dIndex++];
          row.push({ row: r, col: c, val: val, isTarget: isTarget, painted: false });
        }
        matrix.push(row);
      }
      return matrix;
    }

    function renderGridDOM(sheetIdx) {
      const gridEl = document.getElementById(`number-grid-${sheetIdx}`);
      if (!gridEl) return;
      gridEl.innerHTML = '';

      const matrix = gridMatrices[sheetIdx];
      for (let r = 0; r < 14; r++) {
        for (let c = 0; c < 20; c++) {
          const cellData = matrix[r][c];
          const cell = document.createElement('div');
          cell.id = `cell-${sheetIdx}-${r}-${c}`;
          cell.className = 'grid-cell aspect-square bg-white flex items-center justify-center font-extrabold text-xs sm:text-sm md:text-base text-slate-900 border border-slate-300 cursor-pointer transition-all duration-75 select-none rounded-sm active:scale-95';
          cell.innerText = cellData.val;

          cell.onpointerdown = (e) => {
            e.preventDefault();
            startPaint(sheetIdx, r, c);
          };

          cell.onpointerenter = (e) => {
            if (isMouseDown && e.buttons !== 0) {
              doPaint(sheetIdx, r, c);
            }
          };

          cell.ontouchstart = (e) => {
            e.preventDefault();
            startPaint(sheetIdx, r, c);
          };

          gridEl.appendChild(cell);
        }
      }

      gridEl.ontouchmove = (e) => {
        e.preventDefault();
        if (!isMouseDown) return;
        const touch = e.touches ? e.touches[0] : e;
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        if (target && target.classList.contains('grid-cell')) {
          const parts = target.id.split('-');
          if (parts.length === 4) {
            doPaint(parseInt(parts[1]), parseInt(parts[2]), parseInt(parts[3]));
          }
        }
      };
    }

        const gridScore = totalTarget > 0 ? Math.max(0, Math.round(((totalTarget - totalMistakes) / totalTarget) * 100)) : 0;
        const totalScoreForSheet = Math.round((eqCorrect * 5) + (gridScore * 0.5)); 

        if (eqCorrect !== 10 || gridScore !== 100) allPerfect = false;
        if (gridScore > 70 && gridScore < 100) almostPerfect = true;

        let title = '作答結果';

                <span class="font-bold text-slate-800">${gridScore}%</span>
              </div>
              <div class="flex justify-between items-center text-xs text-slate-500 mb-1">
                <span>目標總格數：</span>
                <span>${totalTarget} 格</span>
              </div>
              <div class="flex justify-between items-center text-xs text-slate-500 mb-3">
                <span>失誤格數（漏塗/錯塗）：</span>
                <span>${totalMistakes} 格</span>
              </div>
            </div>
            <div class="flex justify-between items-center text-red-600 pt-2 border-t border-slate-200">
              <span>本題總得分：</span>
              <span class="font-bold text-lg">${totalScoreForSheet} 分</span>
            </div>
          </div>
        `;
      }

      // 更新評分結果彈窗內容
      const modal = document.getElementById('result-modal');
      const modalBox = document.getElementById('modal-box');
      const icon = document.getElementById('modal-icon');
      const msgEl = document.getElementById('modal-msg');
      const detailsContainer = document.getElementById('modal-details-container');

      if (gridMatrices.length > 1) {
        modalBox.classList.remove('max-w-md');
        modalBox.classList.add('max-w-2xl');
        detailsContainer.className = 'overflow-y-auto px-1 mb-4';
        detailsContainer.innerHTML = eqSummaryHtml + `<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${cardsHtml}</div>`;
      } else {
        modalBox.classList.remove('max-w-2xl');
        modalBox.classList.add('max-w-md');
        detailsContainer.className = 'overflow-y-auto px-1 mb-4';
        detailsContainer.innerHTML = eqSummaryHtml + cardsHtml;
      }

      if (allPerfect) {
        icon.innerText = '🎉';
        msgEl.innerText = '太棒了！全對！隱藏數字成功顯現了！';
      } else if (almostPerfect) {
        icon.innerText = '👍';
        msgEl.innerText = '做得很好！只差一點點就全對囉！';
      } else {
        icon.innerText = '💪';
        msgEl.innerText = '再仔細檢查看看乘法算式與著色方格喔！';
      }

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('result-modal').classList.add('hidden');
    }

    function printWorksheet() {
      try {
        window.print();
      } catch (err) {
        document.getElementById('print-modal').classList.remove('hidden');
      }
    }

    function closePrintModal() {
      document.getElementById('print-modal').classList.add('hidden');
    }
  </script>
</body>
</html>
